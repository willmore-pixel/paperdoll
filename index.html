<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e8698a">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paperdoll">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<title>Paperdoll Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Yellowtail&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: pink pattern-shop band on top; croquis sheet centre with a slide-out Designs drawer; camera/undo row, trim tools and swatch strip below (vintage pattern-envelope feel) */
:root{
  --paper:#fffaf8; --panel:#fff; --blush:#fbe7ec; --check:#f7e9ed; --pink:#e8698a; --pink-deep:#c94d6f; --on-pink:#fff;
  --ink:#3a2a2f; --muted:#8b6f77; --line:#efd6dd; --dot:#f3dfe4; --chip:#f7eef0; --shadow:rgba(120,40,60,.14);
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --script:"Yellowtail","Brush Script MT",cursive;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1f181b; --panel:#2a2125; --blush:#3a2830; --check:#5a3a46; --pink:#ef7f9c; --pink-deep:#f59ab1; --on-pink:#2a1218;
  --ink:#f7e9ed; --muted:#c3a6ae; --line:#46343b; --dot:#33262b; --chip:#35292e; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1f181b; --panel:#2a2125; --blush:#3a2830; --check:#5a3a46; --pink:#ef7f9c; --pink-deep:#f59ab1; --on-pink:#2a1218;
  --ink:#f7e9ed; --muted:#c3a6ae; --line:#46343b; --dot:#33262b; --chip:#35292e; --shadow:rgba(0,0,0,.4); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,label.btn:focus-visible{outline:2px solid var(--pink-deep);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* header band */
.top{background:var(--pink);color:var(--on-pink);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:6px;margin-right:auto;line-height:1}
.brand b{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.01em}
.brand i{font-family:var(--script);font-style:normal;font-size:20px;opacity:.92}
.seg{display:inline-flex;background:rgba(255,255,255,.22);border-radius:99px;padding:3px}
.seg button{height:30px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:500}
.seg button.on{background:var(--on-pink);color:var(--pink-deep)}
.hbtn{height:34px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:500;border:1.5px solid rgba(255,255,255,.7);white-space:nowrap}
.hbtn.on{background:var(--on-pink);color:var(--pink-deep);border-color:var(--on-pink)}
.hbtn.solid{background:var(--on-pink);color:var(--pink-deep);border-color:var(--on-pink);font-weight:700}
.hgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* stage */
.main{flex:1;min-height:0;position:relative;display:flex;overflow:hidden}   /* the closed drawer sits off the right edge; clip it so phones keep a device-width layout */
.stage{flex:1;min-width:0;position:relative;overflow:auto;background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.4px,transparent 1.5px);background-size:16px 16px}
.stage-inner{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
.sheet{position:relative;flex:none;background:#fff;box-shadow:0 1px 2px var(--shadow),0 10px 30px var(--shadow);border-radius:3px;touch-action:none}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sizeTag{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;z-index:2;font-size:12px;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.sizeTag b{font-family:var(--display);font-style:italic;color:var(--ink);font-weight:600}
.sizeTag{display:flex;align-items:center;gap:8px}
.skinc{display:flex;align-items:center;gap:6px;border-left:1px solid var(--line);padding-left:8px}
.skinc input{width:92px;height:14px;margin:0;-webkit-appearance:none;appearance:none;border-radius:99px;border:1px solid var(--line);
  background:linear-gradient(90deg,#fff 0 6%,#fbe9df 6%,#f3d0b8,#e7b48f,#d29a6f,#b57a52,#8d5a3b,#613d28,#3e281c)}
.skinc input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--panel);border:2px solid var(--pink-deep);box-shadow:0 1px 3px var(--shadow)}
.skinc input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--pink-deep)}
.zoom{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px;z-index:2}
.zoom button{width:32px;height:30px;border-radius:99px;font-size:18px}
.zoom span{font-size:12px;color:var(--muted);align-self:center;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}

/* designs drawer */
.drawer{position:relative;flex:none;width:236px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding-right:env(safe-area-inset-right,0px);transition:margin-right .25s ease}
.drawer.closed{margin-right:calc(-236px - env(safe-area-inset-right,0px))}
.drawer .tab{position:absolute;left:-30px;top:14px;width:30px;height:40px;background:var(--panel);border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;
  display:flex;align-items:center;justify-content:center;color:var(--muted)}
.drawer .tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .25s}
.drawer.closed .tab svg{transform:rotate(180deg)}
.dhead{padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px}
.dhead h2{margin:0;font-family:var(--display);font-size:20px;font-weight:600}
.search{height:34px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:13px;padding:0 14px;width:100%;box-sizing:border-box}
.dbody{overflow:auto;padding:4px 14px 16px;display:flex;flex-direction:column;gap:14px}
.cat h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--paper);text-align:left}
.card img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:8px;max-width:100%}
.card .nm{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .nm b{font-family:var(--display);font-weight:600;font-size:15px}
.card .nm span{font-size:11px;color:var(--muted)}
.card.on{border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)}
.card.on .nm span{color:var(--pink-deep);font-weight:700}
.empty{font-size:13px;color:var(--muted)}

/* bottom dock */
.dock{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.sq{width:52px;height:46px;border-radius:12px;border:1.5px dashed var(--muted);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);position:relative}
.sq svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sq:disabled{opacity:.35;cursor:default}
.sq input{display:none}
.tipwrap{position:relative;display:inline-flex}
.tip{position:absolute;left:-4px;bottom:calc(100% + 12px);z-index:8;display:flex;align-items:center;gap:8px;white-space:nowrap;
  background:var(--tip-bg);color:var(--on-pink);font-family:var(--display);font-style:italic;font-weight:600;font-size:15px;
  padding:9px 8px 9px 14px;border-radius:14px;box-shadow:0 6px 18px var(--shadow);animation:tipIn .4s ease both}
.tip{--tip-bg:color-mix(in srgb,var(--pink) 75%,#fff)}
.tip::after{content:"";position:absolute;left:24px;top:100%;border:8px solid transparent;border-top-color:var(--tip-bg)}
.tip button{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);font-family:var(--sans);font-style:normal;font-size:15px;line-height:24px}
@keyframes tipIn{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.frame{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.frame input{width:52px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:13px;text-align:center}
.spacer{flex:1}
.label{flex:none;white-space:nowrap;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;min-width:34px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{height:40px;padding:0 12px 0 8px;border-radius:99px;background:var(--chip);display:inline-flex;align-items:center;gap:6px;font-size:14px}
.tool canvas,.tool img{width:34px;height:20px;border-radius:5px;background:#fff}
.tool.on{background:var(--pink);color:var(--on-pink)}
.sw{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px var(--panel)}
.sw.on{outline:2.5px solid var(--pink);outline-offset:1px}
input[type=color]{width:32px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px}
input[type=range]{width:150px;accent-color:var(--pink)}
.dot{width:44px;height:44px;flex:none;border-radius:10px;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
.dot i{display:block;border-radius:50%;max-width:40px;max-height:40px;min-width:2px;min-height:2px}
.dot.erase i{background:none!important;border:1.5px dashed #8b6f77}
.ring{position:absolute;left:0;top:0;z-index:3;pointer-events:none;border-radius:50%;border:1px solid rgba(40,20,28,.75);box-shadow:0 0 0 1px rgba(255,255,255,.85);transform:translate(-50%,-50%)}
.val{font-size:12px;min-width:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.mats{display:flex;gap:6px;flex-wrap:wrap}
.mat{height:34px;padding:0 10px 0 4px;border-radius:99px;background:var(--chip);font-size:13px;display:inline-flex;align-items:center;gap:6px;position:relative}
.mat i{width:26px;height:26px;border-radius:50%;display:inline-block;background-size:cover;background-position:center;border:1px solid rgba(0,0,0,.15)}
.mat.on{background:var(--ink);color:var(--panel)}
.chk[hidden]{display:none}
.chk{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:34px;font-size:13px;cursor:pointer;user-select:none}
.chk input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;border:1.5px solid var(--muted);border-radius:5px;background:var(--panel);cursor:pointer;display:grid;place-content:center}
.chk input:checked{background:var(--check)}
.chk input:checked::after{content:'';width:5px;height:10px;border:solid var(--ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.chk input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
#eraseModes .mat{padding:0 12px}
.mat .x{position:absolute;right:-4px;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:12px;line-height:18px;text-align:center;display:none}
.mat.on .x{display:block}
.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--panel);
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px var(--shadow)}
.modal{position:fixed;inset:0;background:rgba(30,10,18,.55);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mcard{background:var(--panel);border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:90%;display:flex;flex-direction:column;gap:12px}
.mcard h2{margin:0;font-family:var(--display);font-size:20px;font-weight:600}
.mcard img{max-height:58vh;object-fit:contain;background:#fff;border-radius:8px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.mcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.mrow{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.pill{height:38px;padding:0 16px;border-radius:99px;background:var(--chip);font-size:14px}
.pill.primary{background:var(--pink);color:var(--on-pink);font-weight:700}

@media (max-width:760px){
  .drawer{position:absolute;right:0;top:0;bottom:0;z-index:5;box-shadow:-8px 0 24px var(--shadow)}
  .drawer.closed{box-shadow:none}
  input[type=range]{width:110px}
  .brand i{display:none}
  .dock{gap:6px;padding-block:8px}
  .row{flex-wrap:nowrap;min-width:0}
  .row>.field,.row>.tools,.row>.mats{min-width:0}
  .tools,.mats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-block:2px}
  .tool,.mat,.sw{flex:none}
  .field{flex-wrap:nowrap;flex:1}
  .row.cs{flex-wrap:wrap;row-gap:6px}
  #fColor{flex:1 1 100%}
  #fSize{flex:1 1 100%}
  #fSize input[type=range]{flex:1}
  .label{min-width:0}
  .sq{width:44px;height:40px}
  .frame label{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b>Paperdoll</b><i>atelier</i></div>
    <div class="seg" role="group" aria-label="Croquis size">
      <button id="szRegular" data-size="regular">Regular</button>
      <button id="szCurvier" data-size="curvier">Curvier</button>
    </div>
    <div class="hgroup">
      <button class="hbtn on" id="mirror" title="Draw both sides at once">Mirror</button>
      <button class="hbtn" id="penonly" title="Only the S Pen draws; fingers move the page">Pen only</button>
      <button class="hbtn" id="clear">Clear</button>
      <button class="hbtn solid" id="export">Export PNG</button>
    </div>
  </header>

  <div class="main">
    <main class="stage" id="stage">
      <div class="sizeTag"><span id="sizeTag"></span><label class="skinc" title="Skin tone of the croquis (far left: none)">Skin<input type="range" id="skin" min="0" max="100" step="1" aria-label="Skin tone"></label></div>
      <div class="stage-inner">
        <div class="sheet" id="sheet">
          <canvas id="cSkin"></canvas>
          <canvas id="cDraw"></canvas>
          <canvas id="cLine"></canvas>
          <canvas id="cTrim"></canvas>
          <canvas id="cOver"></canvas>
          <div class="ring" id="ring" hidden></div>
        </div>
      </div>
      <div class="zoom"><button id="zout" aria-label="Zoom out">−</button><span id="zval">100%</span><button id="zin" aria-label="Zoom in">+</button></div>
    </main>

    <aside class="drawer" id="drawer" aria-label="Designs">
      <button class="tab" id="drawerTab" aria-label="Hide designs"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <div class="dhead">
        <h2>Designs</h2>
        <input class="search" id="search" type="search" placeholder="Search designs, e.g. bodice" aria-label="Search designs">
      </div>
      <div class="dbody" id="designs"></div>
    </aside>
  </div>

  <section class="dock">
    <div class="row">
      <span class="tipwrap">
      <div class="tip" id="swatchTip" role="dialog" aria-label="Tip" hidden>
        <span>Add your own swatches here</span><button id="tipClose" aria-label="Close tip">×</button>
      </div>
      <label class="sq" id="camBtn" title="Photograph fabric for a swatch" aria-label="Photograph fabric for a swatch" tabindex="0">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
        <input type="file" id="camFile" accept="image/*" capture="environment">
      </label>
      </span>
      <label class="sq" id="albumBtn" title="Make a swatch from a photo" aria-label="Make a swatch from a photo" tabindex="0">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M4 16l5-5 4 4 2-2 5 5"/><circle cx="15.5" cy="9.5" r="1.4"/></svg>
        <input type="file" id="albumFile" accept="image/*">
      </label>
      <button class="sq" id="undo" title="Undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 7H5V3"/><path d="M5.6 7.2A8 8 0 1 1 4 12"/></svg></button>
      <button class="sq" id="redo" title="Redo" aria-label="Redo" disabled><svg viewBox="0 0 24 24"><path d="M15 7h4V3"/><path d="M18.4 7.2A8 8 0 1 0 20 12"/></svg></button>
      <div class="frame"><label for="frameCm">Swatch frame</label><input id="frameCm" type="number" min="2" max="100" value="30"><span>cm</span></div>
    </div>
    <div class="row">
      <span class="label">Tools</span>
      <div class="tools" id="tools"></div>
    </div>
    <div class="row cs">
      <div class="field" id="fColor"><span class="label">Colour</span><div class="mats" id="swatches"></div><input type="color" id="custom" value="#e8698a" aria-label="Custom colour"></div>
      <div class="field" id="fErase" hidden><span class="label">Erase</span><div class="mats" id="eraseModes">
        <button class="mat" data-e="all">Everything</button><button class="mat" data-e="trims">Trims only</button><button class="mat" data-e="paint">Paint only</button></div></div>
      <div class="field" id="fSize"><span class="label">Size</span><input type="range" id="size" min="1" max="80"><span class="val" id="sizeVal"></span><span class="dot" id="sizeDot" aria-hidden="true"><i></i></span><label class="chk" id="fInside" title="Keep paint inside the outlined area where the stroke starts"><input type="checkbox" id="inside">Clip</label></div>
    </div>
    <div class="row" id="fMat">
      <span class="label">Swatches</span>
      <div class="mats" id="mats"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="mcard">
    <h2>Export PNG</h2>
    <img id="outImg" alt="Exported paper doll design">
    <p id="saveHint">You can also press and hold the image and choose Save Image.</p>
    <div class="mrow">
      <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="incBody" checked> Include croquis lines</label>
      <div style="display:flex;gap:8px">
        <button class="pill" id="closeModal">Close</button>
        <button class="pill primary" id="savePng" hidden>Save PNG</button>
      </div>
    </div>
  </div>
</div>

<script>
/* swatch-kit.js — turn a photo of real material into a seamless swatch.
 *
 * No dependencies. Include with <script src="swatch-kit.js"><\/script>; it adds window.SwatchKit.
 *
 *   const sw = await SwatchKit.capture({ source: "camera", sizeCm: 30 });   // or source: "album" / a File
 *   if (sw) img.src = sw.url;   // sw = { url, canvas, sizeCm, seamless }
 *
 *   SwatchKit.makeSeamless(canvasOrImage, { size: 640 })  -> canvas  (method 2+: even out light, then edge-blend)
 *   SwatchKit.svgPattern(id, url, sizeCm, unitsPerCm)     -> "<pattern …>" string for an SVG <defs>
 *   SwatchKit.cssBackground(url, sizeCm, pxPerCm)         -> { backgroundImage, backgroundSize } for an element
 *
 * The camera / crop screen shows a square frame with a cm ruler on its edges. A phone can't measure distance,
 * so the frame is a guide: whatever the user fits in it is treated as sizeCm × sizeCm.
 */
(function () {
  "use strict";

  const DEFAULTS = {
    source: "camera",     // "camera" (live camera, falls back to the phone's own camera), "album", or a File/Blob
    sizeCm: 30,           // real size the frame stands for
    size: 640,            // output pixels per side
    seamless: true,       // run makeSeamless on the result
    quality: 0.85,        // JPEG quality of sw.url
    text: {
      camHint: "把 {cm} × {cm} cm 的材料放滿框內",
      camSmall: "框邊的刻度是公分，可以在旁邊放一把尺對齊",
      cropHint: "拖曳、雙指縮放照片，讓 {cm} × {cm} cm 放滿框內",
      cropSmall: "框邊的刻度是公分",
      cancel: "取消", use: "使用", shot: "拍照", native: "系統相機",

  // ---------- Method 2+: even out the light, then blend the edges into a wrap-around tile ----------

  function makeSeamless(src, opts = {}) {

    let low = null;

      const k = 10, t = canvas(k, k), tx = t.getContext("2d");
      tx.imageSmoothingQuality = "high"; tx.drawImage(c, 0, 0, k, k);
      const b = canvas(N, N), bx = b.getContext("2d");
      bx.imageSmoothingEnabled = true; bx.imageSmoothingQuality = "high"; bx.drawImage(t, 0, 0, N, N);

    for (let i = 0; i < a.length; i += 4) { mean[0] += a[i]; mean[1] += a[i + 1]; mean[2] += a[i + 2]; }

    const out = x.createImageData(N, N), o = out.data, h = N >> 1, bw = N * band;
    for (let y = 0; y < N; y++) for (let xx = 0; xx < N; xx++) {

      o[p * 4 + 3] = 255;
    }
    x.putImageData(out, 0, 0);
    return c;
  }

  // ---------- Using a swatch ----------

  const svgPattern = (id, url, sizeCm, unitsPerCm, x = 0, y = 0) => {
    const s = sizeCm * unitsPerCm;
    return `<pattern id="${id}" patternUnits="userSpaceOnUse" x="${x}" y="${y}" width="${s}" height="${s}"><image href="${url}" width="${s}" height="${s}" preserveAspectRatio="none"/></pattern>`;
  };
  const cssBackground = (url, sizeCm, pxPerCm) => ({ backgroundImage: `url("${url}")`, backgroundSize: `${sizeCm * pxPerCm}px ${sizeCm * pxPerCm}px`, backgroundRepeat: "repeat" });

  // ---------- Camera and crop screen ----------

  const CSS = `
.skit{position:fixed;inset:0;overflow:hidden;contain:strict;z-index:2147483000;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
.skit img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0}
.skit video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.skit .crop-only,.skit.crop .cam-only{display:none}.skit.crop .crop-only{display:block}
.skit-frame{position:absolute;left:50%;top:44%;width:min(84vw,58vh);aspect-ratio:1;transform:translate(-50%,-50%);box-shadow:0 0 0 100vmax rgba(0,0,0,.5);border:2px solid #fff}
.skit-frame svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.skit-hint{position:absolute;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top,0px));margin:0;text-align:center;color:#fff;font-size:15px;font-weight:800;line-height:1.45;text-shadow:0 1px 3px #000}
.skit-hint small{display:block;font-size:12px;font-weight:700;opacity:.85}
.skit-bar{position:absolute;left:0;right:0;bottom:0;padding:18px 24px calc(22px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:#fff;font-weight:800;font-size:14px}
.skit-bar button,.skit-bar label{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.skit-bar>:first-child{justify-self:start}.skit-bar label{justify-self:end;position:relative}
.skit-bar input{position:absolute;inset:0;opacity:0;width:100%}
.skit .skit-shutter{width:70px;height:70px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);background-clip:padding-box}
.skit .skit-shutter:active{transform:scale(.94)}
.skit .skit-use{justify-self:center;padding:12px 26px;border-radius:99px;background:#fff;color:#111;font-weight:900;font-size:16px}`;

  function ruler(cm) {
    // Ticks every cm (long every 5), numbers every 5 cm (or every 10 for big frames).
    const u = 300 / cm, step = cm > 40 ? 10 : 5;
    let ticks = "";
    for (let i = 0; i <= cm; i++) {
      const v = i * u, len = i % 5 ? 7 : 14;
      ticks += `<line x1="${v}" y1="0" x2="${v}" y2="${len}"/><line x1="0" y1="${v}" x2="${len}" y2="${v}"/><line x1="${v}" y1="300" x2="${v}" y2="${300 - len}"/><line x1="300" y1="${v}" x2="${300 - len}" y2="${v}"/>`;
    }

    let nums = "";
    for (let i = 0; i <= cm; i += step) nums += `<text x="${i * u}" y="28">${i}</text>`;
    return `<g stroke="#000" stroke-opacity=".5" stroke-width="3">${ticks}</g><g stroke="#fff" stroke-width="1.4">${ticks}</g>` +
      `<g fill="#fff" font-size="11" font-weight="800" text-anchor="middle" stroke="#000" stroke-opacity=".55" stroke-width="2.5" style="paint-order:stroke">${nums}<text x="150" y="46">cm</text></g>`;
  }

  function capture(options = {}) {
    const o = { ...DEFAULTS, ...options, text: { ...DEFAULTS.text, ...(options.text || {}) } };
    const T = k => o.text[k].replaceAll("{cm}", o.sizeCm);
    if (!document.getElementById("skit-css")) {
      const st = document.createElement("style"); st.id = "skit-css"; st.textContent = CSS; document.head.appendChild(st);
    }
    return new Promise(resolve => {
      const root = document.createElement("div");
      root.className = "skit"; root.hidden = true;
      root.innerHTML = `<video class="cam-only" playsinline muted autoplay></video><img class="crop-only" alt="" draggable="false">
<div class="skit-frame"><svg viewBox="0 0 300 300" aria-hidden="true">${ruler(o.sizeCm)}</svg></div>
<p class="skit-hint cam-only">${T("camHint")}<small>${T("camSmall")}</small></p>
<p class="skit-hint crop-only">${T("cropHint")}<small>${T("cropSmall")}</small></p>
<div class="skit-bar"><button type="button" data-k="cancel">${T("cancel")}</button>
<button type="button" class="skit-shutter cam-only" data-k="shot" aria-label="${T("shot")}"></button>
<button type="button" class="skit-use crop-only" data-k="use">${T("use")}</button>

      }

      async function openCam() {
        const native = $("input[capture]");
        native.onchange = () => { const f = native.files[0]; native.value = ""; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; f ? openCrop(f) : finish(null); };

      }

        const s = Math.min(Math.max(crop.s * k, crop.min), crop.min * 12);

      }

        const prev = pointers.get(e.pointerId);

        else {
          const other = pts.find(p => p !== prev), d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(e.clientX - other.x, e.clientY - other.y);

          crop.x += m1[0] - m0[0]; crop.y += m1[1] - m0[1];
          d0 > 0 ? zoom(d1 / d0, m1[0], m1[1]) : draw();
        }
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      });

      root.addEventListener("wheel", e => { if (crop) { e.preventDefault(); zoom(Math.exp(-e.deltaY / 300), e.clientX, e.clientY); } }, { passive: false });

      $('[data-k="cancel"]').onclick = () => finish(null);
      $('[data-k="use"]').onclick = () => {
        if (!crop) return;
        const f = frame.getBoundingClientRect(), side = Math.min(f.width / crop.s, img.naturalWidth, img.naturalHeight);
        take(img, Math.max(0, (f.left - crop.x) / crop.s), Math.max(0, (f.top - crop.y) / crop.s), side);
      };

        const vw = video.videoWidth, vh = video.videoHeight;

        const box = video.getBoundingClientRect(), f = frame.getBoundingClientRect();

function hideTip(){if($('swatchTip').hidden)return;$('swatchTip').hidden=true;put('paperdoll-tip-swatch','1');}
$('tipClose').onclick=hideTip;$('swatchTip').onclick=hideTip;
for(const id of['camBtn','albumBtn'])$(id).addEventListener('click',hideTip);
for(const id of['camFile','albumFile'])$(id).onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)addPhotoFromFile(f);};
for(const [b,i] of[['camBtn','camFile'],['albumBtn','albumFile']])$(b).onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$(i).click();}};
/* live camera shows the cm frame while shooting; Swatch Kit falls back to the phone's camera app where that isn't allowed */
const liveCam=navigator.mediaDevices?.getUserMedia&&(window.self===window.top||document.featurePolicy?.allowsFeature?.('camera'));   /* a framed page (the claude.ai artifact) usually can't open the camera */
if(liveCam)$('camBtn').addEventListener('click',e=>{e.preventDefault();addPhotoFromFile('camera');});

/* ---------- UI ---------- */
function toolPreview(id){
  const c=document.createElement('canvas');c.width=68;c.height=40;const x=c.getContext('2d'),col='#5a3a44';
  const pts=[];for(let i=0;i<=34;i++){const t=i/34;pts.push({x:6+t*56,y:20+Math.sin(t*6.28)*7});}
  x.lineCap='round';x.strokeStyle=col;x.fillStyle=col;
  if(id==='ink'){x.lineWidth=2.6;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();}
  else if(id==='water'){pts.forEach((p,i)=>{if(i%2)return;const g=x.createRadialGradient(p.x,p.y,1,p.x,p.y,9);g.addColorStop(0,'rgba(232,105,138,.35)');g.addColorStop(1,'rgba(232,105,138,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,9,0,7);x.fill();});}
  else if(id==='fill'){x.fillStyle='#e8698a';x.beginPath();x.moveTo(14,32);x.lineTo(26,8);x.lineTo(54,10);x.lineTo(46,32);x.closePath();x.fill();x.strokeStyle=col;x.lineWidth=1.4;x.stroke();}
  else if(id==='erase'){x.strokeStyle='#d9c6cb';x.lineWidth=12;x.beginPath();x.moveTo(10,28);x.lineTo(58,12);x.stroke();}
  else if(id==='ruffle'){let n=0;for(let i=0;i<56;i+=7)dabRuffle(x,8+i,10,13,col,0,n++);}
  else if(id==='ricrac'){renderRicrac(x,[{x:4,y:20},{x:34,y:20},{x:64,y:20}],7,col);}
  return c.toDataURL();
}
function buildMats(){
  const chips=MATS.map(([k,n])=>`<button class="mat" data-m="${k}"><i style="${k==='solid'?'background:'+S.color:'background-image:url('+tile(k,'#8a7c86').toDataURL()+')'}"></i>${n}</button>`);
  photos.forEach((p,i)=>chips.push(`<button class="mat" data-p="${p.id}" aria-label="Photo swatch ${i+1}"><i style="background-image:url(${p.url})"></i>${p.sizeCm} cm<span class="x" data-del="${p.id}" aria-label="Delete this swatch">×</span></button>`));
  $('mats').innerHTML=chips.join('');syncOn();
}
function buildDesigns(){
  const q=$('search').value.trim().toLowerCase();
  const list=DESIGNS.filter(g=>!q||(g.name+' '+g.zh+' '+g.tags).toLowerCase().includes(q));
  if(!list.length){$('designs').innerHTML=`<p class="empty">No designs match "${q.replace(/[<>&"]/g,'')}". Try bodice or skirt.</p>`;return;}
  const C=CROQUIS[S.size],cats=[...new Set(list.map(g=>g.cat))];
  $('designs').innerHTML=cats.map(cat=>`<div class="cat"><h3>${cat}</h3>${list.filter(g=>g.cat===cat).map(g=>{
    const P=C.pieces[g.id],b=P.box,src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.join(' ')}"><style>${C.css}</style>${P.lines}</svg>`);
    return `<button class="card${S.pieces[g.id]?' on':''}" data-d="${g.id}" aria-pressed="${S.pieces[g.id]}"><img src="${src}" alt="${g.name} line drawing"><span class="nm"><b>${g.name}</b><span>${S.pieces[g.id]?'On':'Off'}</span></span><span style="font-size:12px;color:var(--muted)">${g.zh}</span></button>`;}).join('')}</div>`).join('');
}
function buildUI(){
  $('tools').innerHTML=TOOLS.map(([k,n])=>`<button class="tool" data-t="${k}"><img src="${toolPreview(k)}" alt="">${n}</button>`).join('');
  $('swatches').innerHTML=COLORS.map(c=>`<button class="sw" data-c="${c}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('');
  $('tools').onclick=e=>{const b=e.target.closest('[data-t]');if(b){S.tool=b.dataset.t;sync();}};
  $('swatches').onclick=e=>{const b=e.target.closest('[data-c]');if(b){S.color=b.dataset.c;$('custom').value=S.color;if(S.tool==='erase')S.tool='ink';sync();}};
  $('custom').oninput=e=>{S.color=e.target.value;sync();};
  $('mats').onclick=e=>{
    const del=e.target.closest('[data-del]');
    if(del){photos=photos.filter(p=>p.id!==del.dataset.del);if(S.photo===del.dataset.del)S.photo=null;savePhotos();buildMats();sync();return;}
    const b=e.target.closest('[data-m],[data-p]');if(!b)return;
    if(b.dataset.p){S.photo=b.dataset.p;}else{S.photo=null;S.mat=b.dataset.m;}
    S.tool='fill';sync();};
  $('size').oninput=e=>{S.sizes[S.tool]=+e.target.value;$('sizeVal').textContent=e.target.value;updateDot();
    const b=sheet.getBoundingClientRect(),st=stage.getBoundingClientRect();
    showRing(Math.min(b.width,Math.max(0,st.left+st.width/2-b.left)),Math.min(b.height,Math.max(0,st.top+st.height/2-b.top)));
    clearTimeout(showRing.t);showRing.t=setTimeout(()=>{if(!act)$('ring').hidden=true;},900);};
  $('inside').onchange=e=>{S.inside[S.tool]=e.target.checked;sync();};
  $('eraseModes').onclick=e=>{const b=e.target.closest('[data-e]');if(b){S.eraseMode=b.dataset.e;sync();}};
  $('mirror').onclick=()=>{S.mirror=!S.mirror;sync();};
  $('penonly').onclick=()=>{S.penOnly=!S.penOnly;sync();toast(S.penOnly?'Pen only: the S Pen draws, fingers move the page':'Fingers and pen both draw');};
  document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>switchSize(b.dataset.size));
  $('designs').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const k=b.dataset.d,on=!S.pieces[k],cat=DESIGNS.find(g=>g.id===k).cat;
    if(on)DESIGNS.forEach(g=>{if(g.cat===cat||g.cat==='Dress'||cat==='Dress')S.pieces[g.id]=false;});   /* one top, one bottom at a time; a dress replaces both */
    S.pieces[k]=on;buildDesigns();compose();prefs();};
  $('search').oninput=buildDesigns;
  $('drawerTab').onclick=()=>{$('drawer').classList.toggle('closed');$('drawerTab').setAttribute('aria-label',$('drawer').classList.contains('closed')?'Show designs':'Hide designs');setTimeout(layout,260);};
  $('undo').onclick=undo;$('redo').onclick=redo;
  let armed=0;$('clear').onclick=()=>{const b=$('clear');
    if(armed){clearTimeout(armed);armed=0;b.textContent='Clear';b.classList.remove('on');snap();d.clearRect(0,0,W,H);tr.clearRect(0,0,W,H);hideSample();save();return;}
    b.textContent='Tap again to clear';b.classList.add('on');armed=setTimeout(()=>{armed=0;b.textContent='Clear';b.classList.remove('on');},3000);};
  $('export').onclick=()=>{renderExport();$('modal').hidden=false;};
  $('incBody').onchange=renderExport;
  $('closeModal').onclick=()=>{$('modal').hidden=true;};
  $('savePng').onclick=savePng;
  $('zin').onclick=()=>setZoom(S.zoom*1.25);$('zout').onclick=()=>setZoom(S.zoom/1.25);
  addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}});
}
function syncOn(){
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',!S.photo&&b.dataset.m===S.mat));
  document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===S.photo));
  const solid=document.querySelector('[data-m=solid] i');if(solid)solid.style.background=S.color;
}
function sync(){
  document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tool));
  document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c.toLowerCase()===S.color.toLowerCase()));
  document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('on',b.dataset.size===S.size));
  syncOn();
  $('mirror').classList.toggle('on',S.mirror);$('penonly').classList.toggle('on',S.penOnly);
  $('fSize').hidden=S.tool==='fill';$('fColor').hidden=S.tool==='erase';$('fErase').hidden=S.tool!=='erase';$('fMat').hidden=S.tool!=='fill';
  $('fInside').hidden=!(S.tool in S.inside);if(S.tool in S.inside){$('inside').checked=S.inside[S.tool];}
  document.querySelectorAll('[data-e]').forEach(b=>b.classList.toggle('on',b.dataset.e===S.eraseMode));
  const s=S.sizes[S.tool];$('size').value=s;$('sizeVal').textContent=s;updateDot();
  $('ring').hidden=true;
  $('sizeTag').innerHTML=`Croquis · <b>${S.size==='regular'?'Regular':'Curvier'}</b>`;
  sheet.style.cursor=S.tool==='fill'?'cell':'crosshair';
  prefs();
}

/* ---------- size switch: each croquis keeps its own drawing ---------- */
const store=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const put=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
async function switchSize(sz){
  if(sz===S.size)return;
  clearTimeout(saveT);saveNow();
  S.size=sz;undoS.length=0;redoS.length=0;syncHist();d.clearRect(0,0,W,H);tr.clearRect(0,0,W,H);
  buildDesigns();sync();await compose();await loadDrawing();
}
async function loadDrawing(){
  const saved=store('paperdoll-draw-'+S.size);
  if(saved){try{const im=await loadImg(saved);d.clearRect(0,0,W,H);d.drawImage(im,0,0);}catch(e){}
    const st=store('paperdoll-trim-'+S.size);if(st){try{const im=await loadImg(st);tr.clearRect(0,0,W,H);tr.drawImage(im,0,0);}catch(e){}}}
  else sample();
}

/* ---------- layout & zoom ---------- */
function layout(){
  const r=stage.getBoundingClientRect(),aw=r.width-28,ah=r.height-28;
  const base=Math.max(180,Math.min(aw,ah*W/H));
  sheet.style.width=base*S.zoom+'px';sheet.style.height=base*S.zoom*H/W+'px';updateDot();$('zval').textContent=Math.round(S.zoom*100)+'%';
}
function setZoom(z){S.zoom=Math.min(4,Math.max(1,z));layout();}
addEventListener('resize',layout);

/* ---------- export ---------- */
let exportCanvas=null;
function renderExport(){
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);if($('incBody').checked)x.drawImage(cv.skin,0,0);x.drawImage(cv.draw,0,0);
  x.drawImage($('incBody').checked?cv.line:gl,0,0);x.drawImage(cv.trim,0,0);   /* trims sit over the design lines */
  exportCanvas=c;$('outImg').src=c.toDataURL('image/png');
}
let downloads=null;
async function savePng(){
  if(!downloads||!exportCanvas)return;
  exportCanvas.toBlob(async blob=>{
    try{await downloads.save({filename:`paperdoll-${S.size}.png`,data:blob});toast('PNG saved');}
    catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('The last save window is still open');return;}
      $('savePng').hidden=true;toast('Saving is not available here. Press and hold the image to save it.');}
  },'image/png');
}
window.claude?.use?.('downloads').then(ns=>{downloads=ns;$('savePng').hidden=!ns;if(ns)$('saveHint').textContent='Tap Save PNG, or press and hold the image to save it.';}).catch(()=>{});

/* ---------- persistence ---------- */
let saveT=0;
function saveNow(){put('paperdoll-draw-'+S.size,cv.draw.toDataURL());put('paperdoll-trim-'+S.size,cv.trim.toDataURL());}
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,700);}
function prefs(){put('paperdoll-prefs',JSON.stringify({size:S.size,mirror:S.mirror,penOnly:S.penOnly,inside:S.inside,pieces:S.pieces,color:S.color,skin:S.skin}));}
function toast(msg){const el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200);}
let sampleShown=false;
function hideSample(){if(sampleShown){sampleShown=false;}}
function fillPanels(b,sil){   /* seed every panel inside a box (Zelda's seams run waist to hem); with sil, only inside that piece */
  const k=W/VB,td=boundary(),px=document.createElement('canvas').getContext('2d'),ps=(sil||[]).map(d=>new Path2D(d)),own=(x,y)=>!sil||ps.some(q=>px.isPointInPath(q,x/k,y/k));let dd=d.getImageData(0,0,W,H).data;
  for(let y=(b[1]+12)*k|0;y<(b[1]+b[3])*k;y+=3)for(let x=b[0]*k|0;x<(b[0]+b[2])*k;x+=3){const i=(y*W+x)*4;
    if(td[i+3]>90||dd[i+3]>=40||![[0,0],[5,0],[-5,0],[0,5],[0,-5]].every(([u,v])=>silHit(x+u,y+v)&&own(x+u,y+v)))continue;doFill(x,y);dd=d.getImageData(0,0,W,H).data;}
}
function sample(){
  /* example colourway so the first view shows what the tool does */
  const keep={c:S.color,m:S.mat,p:S.photo,mi:S.mirror};S.mirror=true;S.photo=null;
  const seeds=S.size==='regular'?{bodice:[500,445],sleeve:[605,351],skirt:[500,700]}:{bodice:[500,395],sleeve:[619,330],skirt:[500,670]};
  for(const [k,c,m] of [['etoile','#f3e3c8','knit'],['youthquake','#e8698a','plaid'],['yves','#e8698a','plaid']])if(S.pieces[k]){S.color=c;S.mat=m;{const P=CROQUIS[S.size].pieces[k];fillPanels(P.box,P.sil);}}   /* top first: the skirt box reaches up under it */
  if(S.pieces.skirt){S.color='#e8698a';S.mat='plaid';doFill(...seeds.skirt);}
  if(S.pieces.zelda){S.color='#e8698a';S.mat='plaid';fillPanels(CROQUIS[S.size].pieces.zelda.box);}
  if(S.pieces.bodice){S.color='#f3e3c8';S.mat='knit';doFill(...seeds.bodice);doFill(...seeds.sleeve);}
  if(S.pieces.princess){const P=CROQUIS[S.size].pieces.princess;S.color='#e8698a';S.mat='plaid';fillPanels(P.parts[P.parts.length-1]);S.color='#f3e3c8';S.mat='knit';fillPanels(P.box);}
  S.color=keep.c;S.mat=keep.m;S.photo=keep.p;S.mirror=keep.mi;sampleShown=true;
  toast('This is an example colourway. Tap Clear to start fresh.');
}

/* ---------- boot ---------- */
(async()=>{
  try{const pr=JSON.parse(store('paperdoll-prefs')||'null');
    if(pr){S.size=pr.size==='curvier'?'curvier':'regular';S.mirror=pr.mirror!==false;S.penOnly=!!pr.penOnly;if(pr.pieces)Object.assign(S.pieces,pr.pieces);if(pr.inside)Object.assign(S.inside,pr.inside);if(pr.color)S.color=pr.color;if(pr.skin>=0&&pr.skin<=100)S.skin=+pr.skin;}}catch(e){}
  try{const ps=JSON.parse(store('paperdoll-photos')||'[]');for(const p of ps){try{photos.push({...p,img:await loadImg(p.url)});}catch(e){}}}catch(e){}
  $('custom').value=S.color;$('skin').value=S.skin;
  $('skin').oninput=e=>{S.skin=+e.target.value;paintSkin();prefs();};
  if(innerWidth<=760)$('drawer').classList.add('closed');
  buildUI();buildMats();buildDesigns();sync();layout();
  if(!store('paperdoll-tip-swatch'))$('swatchTip').hidden=false;
  await compose();await loadDrawing();
})();
})();
</script>
